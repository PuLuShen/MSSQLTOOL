# Publishes the released VSIX to both public galleries: the Open SSMS VSIX Gallery (SSMS users) and the
# Open VSIX Gallery (Visual Studio users seeing the same package).
#
# The extension is built locally (or anywhere with SSMS installed): the project references about twenty
# assemblies that only exist inside an SSMS installation, so a GitHub-hosted runner cannot compile it.
# What CI can do - and what this workflow does - is publish the package that a release already carries.
#
# Manual runs: Actions -> Publish to Open SSMS VSIX Gallery -> Run workflow (optionally with a tag).
name: Publish to VSIX Galleries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (leave empty for the latest release)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  publish:
    name: Publish to the gallery
    runs-on: ubuntu-latest
    env:
      SSMS_GALLERY: https://ssmsgallery.azurewebsites.net/api/upload
      VS_GALLERY: https://www.vsixgallery.com/api/upload
    steps:
      - name: Resolve the release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          if [ -z "$tag" ]; then tag="${{ github.event.inputs.tag }}"; fi
          if [ -z "$tag" ]; then
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag" >> "$GITHUB_STEP_SUMMARY"

      - name: Download the VSIX from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tag="${{ steps.release.outputs.tag }}"
          # "release: published" fires when the release is created, which is before the VSIX asset has
          # finished uploading, so wait for the asset instead of failing on the first attempt.
          for attempt in $(seq 1 20); do
            rm -rf dist && mkdir -p dist
            if gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.vsix' --dir dist 2>/dev/null \
               && ls dist/*.vsix >/dev/null 2>&1; then
              echo "asset ready after $attempt attempt(s)"
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "::error::no VSIX asset appeared on $tag"
              gh release view "$tag" --repo "$GITHUB_REPOSITORY" || true
              exit 1
            fi
            echo "attempt $attempt: $tag has no VSIX yet, waiting 15s"
            sleep 15
          done
          ls -l dist

      - name: Verify the downloaded package is a real VSIX
        run: |
          set -euo pipefail
          vsix="$(ls dist/*.vsix | head -n1)"
          # A VSIX is a zip: the first four bytes must be PK\x03\x04.  This is the check that would have
          # caught the release assets that were uploaded as multipart envelopes.
          magic="$(head -c 4 "$vsix" | od -An -tx1 | tr -d ' \n')"
          echo "magic: $magic"
          test "$magic" = "504b0304"
          unzip -l "$vsix" | tail -n 3

      - name: Publish to the Open SSMS VSIX Gallery
        env:
          # Optional: repository secret holding the manage token.  When it is absent the gallery keeps the
          # token it already has for this extension.
          MANAGE_TOKEN: ${{ secrets.VSIX_GALLERY_TOKEN }}
        run: |
          set -euo pipefail
          vsix="$(ls dist/*.vsix | head -n1)"
          repo_url="https://github.com/$GITHUB_REPOSITORY"
          url="$SSMS_GALLERY?repo=$repo_url&readmeUrl=main/README.zh-CN.md&issuetracker=$repo_url/issues"

          args=(-sS --fail-with-body -X POST "$url" -F "file=@$vsix")
          if [ -n "${MANAGE_TOKEN:-}" ]; then
            args+=(-H "X-Manage-Token: $MANAGE_TOKEN")
          fi

          response="$(curl "${args[@]}")"
          echo "$response" > gallery-response-ssms.json
          jq -r '"SSMS gallery: \(.name) \(.version)\ndetails     : \(.detailsLink)\nfeed        : \(.feedLink)\nmanage      : \(.managePageLink)"' gallery-response-ssms.json | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$(jq -r '.hasValidatorErrors' gallery-response-ssms.json)" != "false" ]; then
            echo "::error::the SSMS gallery reported validation errors"
            exit 1
          fi

      - name: Publish to the Open VSIX Gallery
        env:
          MANAGE_TOKEN: ${{ secrets.VSIX_GALLERY_TOKEN }}
        run: |
          set -euo pipefail
          vsix="$(ls dist/*.vsix | head -n1)"
          repo_url="https://github.com/$GITHUB_REPOSITORY"
          # This gallery only accepts multipart/form-data; the raw body form is rejected with 400.
          url="$VS_GALLERY?repo=$repo_url&readmeUrl=main/README.md&issuetracker=$repo_url/issues"

          args=(-sS --fail-with-body -X POST "$url" -F "file=@$vsix")
          if [ -n "${MANAGE_TOKEN:-}" ]; then
            args+=(-H "X-Manage-Token: $MANAGE_TOKEN")
          fi

          response="$(curl "${args[@]}")"
          echo "$response" > gallery-response-vs.json
          jq -r '"VS gallery  : \(.name) \(.version)\nmanage      : \(.manageUrl)\nwarnings    : \([.validation[]?.code] | join(", "))"' gallery-response-vs.json | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$(jq -r '[.validation[]? | select(.severity == "error")] | length' gallery-response-vs.json)" != "0" ]; then
            echo "::error::the VS gallery rejected the package"
            exit 1
          fi

      - name: Upload the gallery response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-response
          path: gallery-response-*.json
          if-no-files-found: ignore
